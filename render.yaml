services:
  - type: web
    name: xeroxgo-cloud
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    buildFilter:
      paths:
        - cloud-backend/**
        - pkg/**
        - Dockerfile
        - go.work*
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: XEROXGO_DEV_MODE
        value: "1"
      - key: DEMO_MODE
        value: "true"
      - key: XEROXGO_PRICE_PER_SHEET_PAISE
        value: "500"
      - key: XEROXGO_DOWNLOAD_SECRET
        generateValue: true
      - key: XEROXGO_WEBHOOK_SECRET
        generateValue: true
      - key: XEROXGO_KIOSK_SECRET
        sync: false
      - key: XEROXGO_PROXY_SECRET
        sync: false
