name: XeroxGo CI & GitOps Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verification Gates (Gate 1 - 6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Runtime Dependencies (qpdf, ghostscript, libreoffice, poppler-utils, cups-filters)
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf ghostscript libreoffice poppler-utils cups-filters

      - name: Run Verification Gates
        run: ./scripts/verify_gate.sh

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Vercel deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is missing"; exit 1; }

      - name: Cache Busting Asset Tagging
        run: |
          BUILD_TAG="${GITHUB_SHA::8}"
          sed -i "s|portal\\.css?v=[^\\"]*|portal.css?v=${BUILD_TAG}|g" index.html
          sed -i "s|portal\\.js?v=[^\\"]*|portal.js?v=${BUILD_TAG}|g" index.html
          sed -i "s|admin\\.js?v=[^\\"]*|admin.js?v=${BUILD_TAG}|g" admin.html

      - name: Load Vercel production project settings
        run: npx --yes vercel@latest pull --yes --environment=production

      - name: Deploy to Vercel Production
        run: npx --yes vercel@latest deploy --prod --yes
