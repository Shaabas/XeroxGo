<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeroxGo Payment</title>
  <meta http-equiv="refresh" content="0; url=/">
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || urlParams.get('dmo');
      if (token) {
        window.location.replace('/pay/' + encodeURIComponent(token));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 40px 16px; background: #F8FAFC;">
  <p style="color: #64748B; font-size: 15px;">Redirecting to XeroxGo...</p>
</body>
</html>
